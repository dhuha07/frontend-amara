<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1e3a8a" />
    <title>AMARA Bot - DPMP4KB Kota Magelang</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // 1) Terapkan tema lebih awal supaya tidak berkedip putih lalu gelap
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}

      // 2) Bangunkan backend selagi JavaScript masih diunduh (mengurangi cold start)
      (function () {
        var api = "%VITE_API_BASE_URL%";
        if (api.indexOf("http") !== 0) return;
        var l = document.createElement("link");
        l.rel = "preconnect";
        l.href = api;
        l.crossOrigin = "anonymous";
        document.head.appendChild(l);
        fetch(api + "/", { mode: "no-cors", cache: "no-store" }).catch(function () {});
      })();
    </script>

    <style>
      html { background: #f9fafb; }
      html.dark { background: #111827; }
      .splash {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        color: #4b5563;
      }
      html.dark .splash { color: #9ca3af; }
      .splash img { width: 72px; height: 72px; animation: splash-denyut 1.6s ease-in-out infinite; }
      .splash p { margin: 0; font-size: 14px; }
      .splash-garis { width: 120px; height: 3px; border-radius: 3px; background: rgba(16, 185, 129, 0.2); overflow: hidden; }
      .splash-garis::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #10b981;
        animation: splash-geser 1.2s ease-in-out infinite;
      }
      @keyframes splash-denyut { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.08); opacity: 1; } }
      @keyframes splash-geser { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Memuat">
        <img src="/amara_bulat.png" alt="" />
        <div class="splash-garis"></div>
        <p>Memuat AMARA Bot...</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
